<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hulu Sign Up</title>

  <link rel="stylesheet" href="frontcss.css">
</head>

<body>
  <div class="top-logo">
    <img src="assets/logo.png" alt="Cinevo Logo">
  </div>

  <div class="container">

    <div class="form-box">

      

      <h2>Create Account</h2>

      <input
        type="text"
        id="username"
        placeholder="Username"
      >

      <input
        type="email"
        id="email"
        placeholder="Email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <input
        type="password"
        id="confirm-password"
        placeholder="Confirm Password"
      >

      <button onclick="signup()">
        Create Account
      </button>

      <p id="message"></p>

      <p>
        Already have an account?
        <a href="login.html">Login</a>
      </p>

    </div>

  </div>

  <script src="main.js"></script>

</body>
</html>
