<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hulu Login</title>

  <link rel="stylesheet" href="frontcss.css">
</head>

<body>
    <div class="top-logo">
        <img src="assets/logo.png" alt="Cinevo Logo">
    </div>
  
<div class="container">

    <div class="form-box">

      <h2>Login</h2>

      <input
        type="text"
        id="username"
        placeholder="Username"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button onclick="login()">
        Login
      </button>

      <p id="message"></p>

        <p class="forgot">
            <a href="forgot.html">Forgot Password?</a>
        </p>

      <p>
        Don’t have an account?
        <a href="signup.html">Sign Up</a>
      </p>

    </div>

  </div>

  <script src="main.js"></script>

</body>
</html>
