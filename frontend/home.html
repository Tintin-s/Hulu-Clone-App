<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hulu Clone</title>

  <link rel="stylesheet" href="home.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <div class="nav-logo">
      <img src="assets/logo.png" alt="Cinevo Logo">
    </div>

    <button onclick="logout()">
      Logout
    </button>
  </nav>

  <!-- HERO SECTION -->
  <header class="hero">

    <h2>
      Unlimited Movies, TV Shows, and More
    </h2>

    <p>
      Watch your favorite entertainment anytime, anywhere.
    </p>

    <button>
      Watch Now
    </button>

  </header>

  <!-- MOVIE SECTION TITLE -->
  <h2 class="section-title">
    Trending Now
  </h2>

  <!-- MOVIES -->
  <section class="movies">

    <div class="movie-card">
      The Batman
    </div>

    <div class="movie-card">
      Interstellar
    </div>

    <div class="movie-card">
      Avatar
    </div>

    <div class="movie-card">
      Dune
    </div>

    <div class="movie-card">
      John Wick
    </div>

    <div class="movie-card">
      Inception
    </div>

  </section>

  <script src="home.js"></script>

</body>
</html>
